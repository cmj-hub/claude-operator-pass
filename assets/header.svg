<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="claude-operator-pass - Operator Pass API wrapper">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#060609" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CC4714" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gridLines" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1A1A2E" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#060609"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>
  <rect x="0" y="317" width="1280" height="3" fill="url(#accent)"/>

  <text x="640" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="-1.5">claude-operator-pass</text>

  <text x="640" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#9CA3AF" font-weight="400">Operator Pass API wrapper</text>

  <text x="640" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6B7280" font-weight="400">22+ deterministic GTM tools as agent-callable endpoints</text>

  <g transform="translate(640, 275)">
    <rect x="-90" y="0" width="180" height="22" rx="11" fill="#0F172A" stroke="#EC4899" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" text-anchor="middle" fill="#EC4899" letter-spacing="2" font-weight="600">JMC SKILL PACK</text>
  </g>
