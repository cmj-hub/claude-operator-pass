# JMC skill-pack Release
# Triggered by pushing a tag matching v*.*.*
# Creates a GitHub Release with notes from CHANGELOG.md.
#
# No secrets required beyond the auto-provided GITHUB_TOKEN.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes for this version
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md").read()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          notes = m.group(1).strip() if m else f"Release v{version}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("notes<<EOF\n")
              f.write(notes)
              f.write("\nEOF\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 \
            && gh release edit "${{ steps.version.outputs.tag }}" \
                 --notes "${{ steps.notes.outputs.notes }}" \
            || gh release create "${{ steps.version.outputs.tag }}" \
                 --title "${{ steps.version.outputs.tag }}" \
                 --notes "${{ steps.notes.outputs.notes }}"
